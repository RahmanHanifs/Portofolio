<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#052E2B" />
    <meta name="description" content="Rahman Hanif Aji Saputra — Data Analyst &amp; Data Enthusiast. Turning raw data into sharp decisions." />
    <title>Rahman Hanif Aji Saputra — Data Analyst</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Prevent flash of wrong theme: read persisted preference before first paint -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("portfolio-theme");
          var useDark = saved ? saved === "dark" : true;
          document.documentElement.classList.toggle("dark", useDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
